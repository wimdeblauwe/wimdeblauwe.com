baseURL = "https://www.wimdeblauwe.com/"
locale = "en-us"
title = "Wim Deblauwe"
copyright = "© 2022 Wim Deblauwe"
googleAnalytics = "G-VJZ8LM94JG"
mainSections = ["blog"]
enableRobotsTXT = true

[params]
    images = ['images/wim-deblauwe.jpg']
    favicon = 'favicon.svg'
    featureNewBook = true

[[menu.main]]
name = "Blog"
url = "/"
weight = 1

[[menu.main]]
name = "Projects"
url = "/projects"
weight = 2

[[menu.main]]
name = "Books"
url = "/books"
weight = 3

[[menu.main]]
name = "Conferences"
url = "/conferences"
weight = 4

[[menu.main]]
name = "About"
url = "/about"
weight = 5

# Markdown for AI agents: llms.txt on the homepage, and a
# Markdown twin of every blog post. Hugo writes the twin as <slug>/index.md;
# scripts/html-to-markdown.mjs converts it and moves it to <slug>.md, the URL
# the templates link to (see partials/agents/markdown-url.html). uglyURLs is
# not an option for that: it also changes the alias redirect paths of old posts.
[outputFormats.llms]
baseName = "llms"
mediaType = "text/plain"
isPlainText = true

[outputs]
home = ["html", "rss", "llms"]

[[cascade]]
outputs = ["html", "markdown"]
[cascade.target]
kind = "page"
path = "{/blog,/blog/**}"

[[cascade]]
outputs = ["html", "markdown"]
[cascade.target]
kind = "page"
path = "{/about,/books/**,/projects,/conferences}"

[[cascade]]
outputs = ["html", "rss", "markdown"]
[cascade.target]
kind = "section"
path = "/books"

# Enable tags.
[taxonomies]
tag = "tags"

# Related posts. Hugo's built-in defaults only index "keywords", which no post
# sets, so tags are indexed explicitly here.
[related]
  threshold = 20
  includeNewer = true
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "date"
    weight = 10

# Emit <a class="anchor" href="#id"> before each section heading (styled as a
# copper diamond in CSS) without touching the per-post .adoc attributes.
[markup.asciidocExt.attributes]
sectanchors = ""
# Syntax highlighting for all posts. Rouge emits token classes instead of
# inline colours; the colours live in assets/css/main.css.
source-highlighter = "rouge"
rouge-css = "class"

[privacy.youtube]
privacyEnhanced = true

[privacy.googleAnalytics]
anonymizeIP = true
respectDoNotTrack = true
useSessionStorage = true

[security]
enableInlineShortcodes = false
# Non-blog pages are text/html content files; newer Hugo versions deny those by default.
allowContent = ['.*']

[security.exec]
allow = ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$', 'asciidoctor']
osEnv = ['(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM|GEM_PATH)$']

[security.funcs]
getenv = ['^HUGO_']

[security.http]
methods = ['(?i)GET|POST']
urls = ['.*']
